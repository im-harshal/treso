---
# 2. THE DATABASE (StatefulSet for data durability)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 5Gi

---
# 3. THE SERVICE (Internal Networking)
apiVersion: v1
kind: Service
metadata:
  name: db # We name it 'db' to match your Spring Boot application.properties url!
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

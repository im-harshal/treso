---
# 2. THE DEPLOYMENT (Runs the container)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret

---
# 3. THE SERVICE (Internal Networking)
apiVersion: v1
kind: Service
metadata:
  name: db # We name it 'db' to match your Spring Boot application.properties url!
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
